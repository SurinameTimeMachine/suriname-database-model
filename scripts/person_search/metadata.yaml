title: Suriname Time Machine — Person Search
description: >-
  Unified, person-centric local search database across Surinamese historical
  datasets (civil records, ward registers, slave & emancipation registers,
  almanakken, censuses, contract labour). Built locally with
  scripts/person_search/build_db.py. RESTRICTED/EMBARGOED datasets are local
  use only and must never be published.

# Datasette 0.65 does not read server settings from metadata (-m). Pass them on the
# command line instead (restricted data stays local, so downloads stay off):
#
#   scripts/person_search/serve.sh   (search page at http://127.0.0.1:8001/ui/index.html)
#
# or by hand:
#   uvx datasette suriname_person_search.db -m scripts/person_search/metadata.yaml \
#     --setting default_page_size 50 --setting sql_time_limit_ms 20000 \
#     --setting allow_download off --setting allow_csv_stream off --port 8001

databases:
  suriname_person_search:
    description: >-
      Person attestations across all person-bearing datasets
      (02, 03, 04, 05, 06, 09, 10, 11, 12, 13). One row per person-role cell,
      searchable via FTS5. Licensing/embargo per dataset is recorded in `sources`.
    tables:
      sources:
        description: Dataset registry with licensing / embargo status.
        label_column: source_dataset
        facets: [embargo, license]
      certificates:
        description: One row per source record (certificate, register entry, census record, almanak entry).
        facets: [source_dataset, record_type, collection, register, event_year, district]
      persons:
        description: The unified search unit — one row per person-role attestation.
        label_column: full_name
        facets:
          - source_dataset
          - role
          - status
          - sex
          - district
          - plantation_name
          - event_year
      person_names:
        description: Alternate / former names (alias, maiden, widow, emancipation, baptized, spelling variants).
        facets: [kind]
      relations:
        description: Kinship and role edges (parent-child, spouse, enslaver-enslaved, witness, employer-plantation).
        facets: [relation_type, confidence]
      locations:
        description: Location strings with normalization and (when resolved) gazetteer place IDs.
        facets: [source_dataset, precision, field_origin]
      group_observations:
        description: Head-counts that cannot be individualised (enslaved matrices, almanak totals).
        facets: [category, source_dataset]
      annotations:
        description: Curator comments, owner prose, family relations and memo fields kept verbatim.
        facets: [status, source_file]
    queries:
      person_search:
        title: 'Person search (prefix, all datasets)'
        description: FTS5 prefix search across names, aliases, places and occupations.
        sql: |
          SELECT p.full_name, p.role, p.source_dataset, p.event_year, p.location,
                 c.item_id, p.person_id
          FROM persons_fts f
          JOIN persons p ON p.person_id = f.rowid
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          -- quote the input as one FTS5 phrase and make its last token a prefix:
          -- "badl" finds Badloe, and punctuation such as "J.W." stays valid
          WHERE persons_fts MATCH '"' || replace(trim(:q), '"', '""') || '"*'
          ORDER BY rank
          LIMIT 100
      person_dossier:
        title: 'Person dossier by name (exact normalised)'
        description: All attestations for a normalised name, across every dataset and role.
        sql: |
          SELECT p.person_id, p.full_name, p.role, p.source_dataset, p.event_year,
                 p.occupation, p.location, p.plantation_name, p.status, c.item_id
          FROM persons p
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE p.name_norm = :name
          ORDER BY p.event_year, p.source_dataset
          LIMIT 500
      contract_search:
        title: 'Contract number search'
        description: Find migrants / labourers / census residents by contract number (substring).
        sql: |
          WITH hits AS (
            SELECT contract_number FROM contract_numbers
             WHERE contract_number LIKE '%' || :contract || '%'
             LIMIT 500
          )
          SELECT p.full_name, p.role, p.source_dataset, p.contract_number,
                 p.plantation_name, c.item_id
          FROM persons p
          JOIN hits ON hits.contract_number = p.contract_number
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          ORDER BY p.source_dataset, p.full_name
          LIMIT 200
      owner_plantation_search:
        title: 'Owner / manager search by plantation'
        description: Plantation owners, administrators, directors and heirs (almanakken, ward registers).
        sql: |
          SELECT p.full_name, p.role, p.source_dataset, p.event_year,
                 p.plantation_name, p.district, c.item_id
          FROM persons p
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE p.role IN ('owner','heirs','administrator','director',
                           'administrator_europe','administrator_suriname','blank_officier')
            AND (:plantation IS NULL OR p.plantation_name LIKE '%' || :plantation || '%')
            AND (:name IS NULL OR p.name_norm LIKE '%' || :name || '%')
          ORDER BY p.plantation_name, p.event_year
          LIMIT 200
      enslaver_enslaved:
        title: 'Enslaved persons by owner'
        description: Slave & emancipation register entries with their owner/enslaver.
        sql: |
          SELECT p.full_name AS enslaved_person, p.status, p.plantation_name,
                 p.birth_year, c.series, c.item_id,
                 (SELECT o.full_name FROM relations r
                    JOIN persons o ON o.person_id = r.from_person
                   WHERE r.certificate_id = c.certificate_id
                     AND r.relation_type = 'enslaver-enslaved' LIMIT 1) AS enslaver
          FROM persons p
          JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE p.source_dataset = '05-slave-emancipation'
            AND p.role IN ('enslaved','emancipated')
            AND (:owner IS NULL OR p.person_id IN (
                  SELECT r.to_person FROM relations r
                    JOIN persons o ON o.person_id = r.from_person
                   WHERE r.relation_type = 'enslaver-enslaved'
                     AND o.name_norm LIKE '%' || :owner || '%'))
          ORDER BY enslaver, enslaved_person
          LIMIT 300
      cross_dataset_matches:
        title: 'Cross-dataset name matches'
        description: Normalised names appearing in more than one dataset (candidate links, never merged).
        sql: |
          SELECT person_name, datasets, which_datasets, roles,
                 first_year, last_year, attestations
          FROM cross_dataset_names
          WHERE (:name IS NULL OR person_name LIKE '%' || :name || '%')
          ORDER BY datasets DESC, attestations DESC
          LIMIT 200
      dataset_licensing:
        title: 'Dataset licensing & embargo status'
        sql: |
          SELECT source_dataset, title, license, embargo, raw_path, notes FROM sources

      # ---- Queries used by the search page (scripts/person_search/ui/) -----------
      # Parameters that are not given arrive as '' and switch their filter off.
      # :match is an FTS5 expression built by the page, e.g. "maria"* "elis"*.
      ui_search:
        title: 'Search page: person results'
        hide_sql: true
        sql: |
          WITH hits AS (
            SELECT rowid AS person_id, rank FROM persons_fts WHERE persons_fts MATCH :match
          )
          SELECT p.person_id, p.full_name, p.role, p.source_dataset, p.sex, p.age,
                 p.event_year AS year, p.status, p.occupation,
                 COALESCE(p.plantation_name, c.plantation_name) AS plantation,
                 COALESCE(p.location, c.cert_place, c.address_text, p.district, c.district) AS place,
                 c.record_type, c.collection, p.certificate_id
          FROM hits h
          JOIN persons p ON p.person_id = h.person_id
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE (:dataset = '' OR p.source_dataset = :dataset)
            AND (:role = '' OR p.role = :role)
            AND (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
            AND (:place = '' OR (COALESCE(p.location, '') || ' ' || COALESCE(p.plantation_name, '') || ' ' ||
                 COALESCE(c.plantation_name, '') || ' ' || COALESCE(c.cert_place, '') || ' ' ||
                 COALESCE(c.address_text, '') || ' ' || COALESCE(p.district, '') || ' ' ||
                 COALESCE(c.district, '')) LIKE '%' || :place || '%')
          ORDER BY CASE WHEN :sort = 'year' THEN COALESCE(p.event_year, 9999) END, h.rank
          LIMIT 51 OFFSET CAST(:offset AS INTEGER)
      ui_facets:
        title: 'Search page: filter counts'
        hide_sql: true
        sql: |
          WITH hits AS (
            SELECT rowid AS person_id FROM persons_fts WHERE persons_fts MATCH :match
          ),
          f AS MATERIALIZED (
            SELECT p.source_dataset AS ds, p.role AS role, (p.event_year / 10) * 10 AS decade,
                   COALESCE(p.plantation_name, c.plantation_name) AS plantation
            FROM hits h
            JOIN persons p ON p.person_id = h.person_id
            LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
            WHERE (:dataset = '' OR p.source_dataset = :dataset)
              AND (:role = '' OR p.role = :role)
              AND (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
              AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
              AND (:place = '' OR (COALESCE(p.location, '') || ' ' || COALESCE(p.plantation_name, '') || ' ' ||
                   COALESCE(c.plantation_name, '') || ' ' || COALESCE(c.cert_place, '') || ' ' ||
                   COALESCE(c.address_text, '') || ' ' || COALESCE(p.district, '') || ' ' ||
                   COALESCE(c.district, '')) LIKE '%' || :place || '%')
          )
          SELECT 'dataset' AS facet, ds AS value, COUNT(*) AS n FROM f GROUP BY ds
          UNION ALL SELECT 'role', role, COUNT(*) FROM f GROUP BY role
          UNION ALL SELECT 'decade', decade, COUNT(*) FROM f WHERE decade IS NOT NULL GROUP BY decade
          UNION ALL SELECT * FROM (
            SELECT 'plantation', plantation, COUNT(*) AS n FROM f
             WHERE plantation IS NOT NULL GROUP BY plantation ORDER BY n DESC LIMIT 15)
      ui_person:
        title: 'Search page: one person with their record'
        hide_sql: true
        sql: |
          SELECT p.*, s.title AS dataset_title, s.license, s.embargo,
                 c.record_type, c.collection, c.register, c.item_id, c.inventory_number,
                 c.folio, c.page, c.certificate_number, c.series,
                 c.event_date AS record_event_date, c.cert_date AS record_date,
                 c.cert_place AS record_place, c.cert_location AS record_location,
                 c.district AS record_district, c.plantation_name AS record_plantation,
                 c.ward_code AS record_ward, c.address_text AS record_address,
                 c.contract_number AS record_contract, c.registration_number AS record_registration
          FROM persons p
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          LEFT JOIN sources s ON s.source_dataset = p.source_dataset
          WHERE p.person_id = CAST(:id AS INTEGER)
      ui_record_persons:
        title: 'Search page: everyone on the same record'
        hide_sql: true
        sql: |
          SELECT person_id, full_name, role, role_index, sex, age, occupation, status
          FROM persons
          WHERE certificate_id = CAST(:cert AS INTEGER)
          ORDER BY role, role_index, person_id
          LIMIT 200
      ui_relations:
        title: 'Search page: relations of a person'
        hide_sql: true
        sql: |
          SELECT r.relation_type, r.confidence, r.detail, r.certificate_id,
                 CASE WHEN r.from_person = CAST(:id AS INTEGER) THEN 'out' ELSE 'in' END AS direction,
                 o.person_id AS other_id, o.full_name AS other_name, o.role AS other_role,
                 o.source_dataset AS other_dataset, o.event_year AS other_year
          FROM relations r
          JOIN persons o ON o.person_id = CASE WHEN r.from_person = CAST(:id AS INTEGER)
                                               THEN r.to_person ELSE r.from_person END
          WHERE r.from_person = CAST(:id AS INTEGER) OR r.to_person = CAST(:id AS INTEGER)
          LIMIT 300
      ui_names:
        title: 'Search page: other names of a person'
        hide_sql: true
        sql: |
          SELECT kind, value FROM person_names WHERE person_id = CAST(:id AS INTEGER)
      ui_notes:
        title: 'Search page: notes and memo fields of a record'
        hide_sql: true
        sql: |
          -- annotations carry no dataset column yet; match on item_id within the
          -- same data folder (first 8 characters of the source path, e.g. 'data/12-')
          SELECT a.status, a.text, a.user_id, a.timestamp
          FROM certificates c
          JOIN annotations a ON a.item_id = c.item_id
          WHERE c.certificate_id = CAST(:cert AS INTEGER)
            AND substr(a.source_file, 1, 8) = substr(c.source_file, 1, 8)
          LIMIT 100
      ui_same_name:
        title: 'Search page: same name elsewhere (candidates, never merged)'
        hide_sql: true
        sql: |
          -- only name kinds that name the person themself (not father_name, spouse_name
          -- or places of origin, which person_names also holds)
          WITH me AS (SELECT person_id, name_norm FROM persons WHERE person_id = CAST(:id AS INTEGER)),
          own_names AS (
            SELECT person_id, kind, value_norm FROM person_names
             WHERE kind IN ('orig_spelling', 'former_name', 'emancipation_name', 'maiden_name',
                            'widow_name', 'baptized_name', 'display_name')
          ),
          keys AS (
            SELECT name_norm AS k FROM me WHERE name_norm IS NOT NULL
            UNION SELECT value_norm FROM own_names
             WHERE person_id = (SELECT person_id FROM me) AND value_norm IS NOT NULL
          ),
          cand AS (
            SELECT p.person_id, 'name' AS via FROM persons p WHERE p.name_norm IN (SELECT k FROM keys)
            UNION
            SELECT n.person_id, n.kind FROM own_names n WHERE n.value_norm IN (SELECT k FROM keys)
          )
          SELECT p.person_id, p.full_name, p.role, p.source_dataset, p.event_year AS year,
                 COALESCE(p.plantation_name, p.location, p.district) AS place, MIN(cand.via) AS via
          FROM cand JOIN persons p ON p.person_id = cand.person_id
          WHERE p.person_id <> CAST(:id AS INTEGER)
          GROUP BY p.person_id
          ORDER BY p.event_year
          LIMIT 150
      ui_datasets:
        title: 'Search page: dataset list'
        hide_sql: true
        sql: |
          SELECT source_dataset, title, license, embargo, notes FROM sources ORDER BY source_dataset
