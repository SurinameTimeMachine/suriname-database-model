title: Suriname Time Machine — Person Search
description: >-
  Unified, person-centric local search database across Surinamese historical
  datasets (civil records, ward registers, slave & emancipation registers,
  almanakken, censuses, contract labour). Built locally with
  scripts/person_search/build_db.py. RESTRICTED/EMBARGOED datasets are local
  use only and must never be published.

# Datasette 0.65 does not read server settings from metadata (-m). Pass them on the
# command line instead (restricted data stays local, so downloads stay off):
#
#   scripts/person_search/serve.sh   (search page at http://127.0.0.1:8001/ui/index.html)
#
# or by hand:
#   uvx datasette suriname_person_search.db -m scripts/person_search/metadata.yaml \
#     --setting default_page_size 50 --setting sql_time_limit_ms 20000 \
#     --setting allow_download off --setting allow_csv_stream off --port 8001

databases:
  suriname_person_search:
    description: >-
      Person attestations across all person-bearing datasets
      (02, 03, 04, 05, 06, 09, 10, 11, 12, 13). One row per person-role cell,
      searchable via FTS5. Licensing/embargo per dataset is recorded in `sources`.
    tables:
      sources:
        description: Dataset registry with licensing / embargo status.
        label_column: source_dataset
        facets: [embargo, license]
      certificates:
        description: One row per source record (certificate, register entry, census record, almanak entry).
        facets: [source_dataset, record_type, collection, register, event_year, district]
      persons:
        description: The unified search unit — one row per person-role attestation.
        label_column: full_name
        facets:
          - source_dataset
          - role
          - status
          - sex
          - district
          - plantation_name
          - event_year
      person_names:
        description: Alternate / former names (alias, maiden, widow, emancipation, baptized, spelling variants).
        facets: [kind]
      relations:
        description: Kinship and role edges (parent-child, spouse, partner, enslaver-enslaved, witness, employer-plantation).
        facets: [relation_type, confidence]
      locations:
        description: Location strings with normalization and (when resolved) gazetteer place IDs.
        facets: [source_dataset, precision, field_origin]
      group_observations:
        description: Head-counts that cannot be individualised (enslaved matrices, almanak totals).
        facets: [category, source_dataset]
      annotations:
        description: Curator comments, owner prose, family relations, memo fields and marginal notes kept verbatim.
        facets: [source_dataset, status]
      gazetteer:
        description: >-
          Places of data/places-gazetteer.jsonld (stm-xxxxx ids with lat/lng), plus Paramaribo streets
          derived from the street layers 1758-1916 and the Concordans Paramaribo (type 'street',
          id stm-street-...). Built by scripts/person_search/link_places.py.
          For historical addresses in Paramaribo we are grateful for the Concordans by Dr. Muntjewerff,
          see https://www.concordansparamaribo.info/. This is a pilot version and can contain mistakes
          that are not attributable to Dr. Muntjewerff.
        label_column: prefLabel
        facets: [type, source]
      place_geo:
        description: >-
          One row per distinct place string (locations.location_norm): the best guess of where it is.
          match_type: address1885 (1885 address point, via the Concordans Paramaribo), gazetteer
          (plantation, settlement, river, district...), street-centroid (Paramaribo street), unplaced.
          confidence 0-1; with several possible places the confidence is divided by their number and
          the note says so. Automatic, not reviewed. Address links use the Concordans Paramaribo by
          Dr. Muntjewerff (https://www.concordansparamaribo.info/), a pilot version that can contain
          mistakes that are not attributable to Dr. Muntjewerff.
        facets: [match_type]
    queries:
      person_search:
        title: 'Person search (prefix, all datasets)'
        description: FTS5 prefix search across names, aliases, places and occupations.
        sql: |
          SELECT p.full_name, p.role, p.source_dataset, p.event_year, p.location,
                 c.item_id, p.person_id
          FROM persons_fts f
          JOIN persons p ON p.person_id = f.rowid
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          -- quote the input as one FTS5 phrase and make its last token a prefix:
          -- "badl" finds Badloe, and punctuation such as "J.W." stays valid
          WHERE persons_fts MATCH '"' || replace(trim(:q), '"', '""') || '"*'
          ORDER BY rank
          LIMIT 100
      person_dossier:
        title: 'Person dossier by name (exact normalised)'
        description: All attestations for a normalised name, across every dataset and role.
        sql: |
          SELECT p.person_id, p.full_name, p.role, p.source_dataset, p.event_year,
                 p.occupation, p.location, p.plantation_name, p.status, c.item_id
          FROM persons p
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE p.name_norm = :name
          ORDER BY p.event_year, p.source_dataset
          LIMIT 500
      contract_search:
        title: 'Contract number search'
        description: Find migrants / labourers / census residents by contract number (substring).
        sql: |
          WITH hits AS (
            SELECT contract_number FROM contract_numbers
             WHERE contract_number LIKE '%' || :contract || '%'
             LIMIT 500
          )
          SELECT p.full_name, p.role, p.source_dataset, p.contract_number,
                 p.plantation_name, c.item_id
          FROM persons p
          JOIN hits ON hits.contract_number = p.contract_number
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          ORDER BY p.source_dataset, p.full_name
          LIMIT 200
      owner_plantation_search:
        title: 'Owner / manager search by plantation'
        description: Plantation owners, administrators, directors and heirs (almanakken, ward registers).
        sql: |
          SELECT p.full_name, p.role, p.source_dataset, p.event_year,
                 p.plantation_name, p.district, c.item_id
          FROM persons p
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE p.role IN ('owner','heirs','administrator','director',
                           'administrator_europe','administrator_suriname','blank_officier')
            AND (:plantation IS NULL OR p.plantation_name LIKE '%' || :plantation || '%')
            AND (:name IS NULL OR p.name_norm LIKE '%' || :name || '%')
          ORDER BY p.plantation_name, p.event_year
          LIMIT 200
      enslaver_enslaved:
        title: 'Enslaved persons by owner'
        description: Slave & emancipation register entries with their owner/enslaver.
        sql: |
          SELECT p.full_name AS enslaved_person, p.status, p.plantation_name,
                 p.birth_year, c.series, c.item_id,
                 (SELECT o.full_name FROM relations r
                    JOIN persons o ON o.person_id = r.from_person
                   WHERE r.certificate_id = c.certificate_id
                     AND r.relation_type = 'enslaver-enslaved' LIMIT 1) AS enslaver
          FROM persons p
          JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE p.source_dataset = '05-slave-emancipation'
            AND p.role IN ('enslaved','emancipated')
            AND (:owner IS NULL OR p.person_id IN (
                  SELECT r.to_person FROM relations r
                    JOIN persons o ON o.person_id = r.from_person
                   WHERE r.relation_type = 'enslaver-enslaved'
                     AND o.name_norm LIKE '%' || :owner || '%'))
          ORDER BY enslaver, enslaved_person
          LIMIT 300
      cross_dataset_matches:
        title: 'Cross-dataset name matches'
        description: Normalised names appearing in more than one dataset (candidate links, never merged).
        sql: |
          SELECT person_name, datasets, which_datasets, roles,
                 first_year, last_year, attestations
          FROM cross_dataset_names
          WHERE (:name IS NULL OR person_name LIKE '%' || :name || '%')
          ORDER BY datasets DESC, attestations DESC
          LIMIT 200
      dataset_licensing:
        title: 'Dataset licensing & embargo status'
        sql: |
          SELECT source_dataset, title, license, embargo, raw_path, notes FROM sources

      # ---- Queries used by the search page (scripts/person_search/ui/) -----------
      # Parameters that are not given arrive as '' and switch their filter off.
      # :match is an FTS5 expression built by the page, e.g. "maria"* "elis"*.
      ui_search:
        title: 'Search page: person results'
        hide_sql: true
        sql: |
          -- :mode 'fuzzy' searches the phonetic keys; other modes the names/places index
          WITH hits AS (
            SELECT rowid AS person_id, rank FROM persons_fts
             WHERE :mode <> 'fuzzy' AND persons_fts MATCH :match
            UNION ALL
            SELECT rowid AS person_id, rank FROM persons_phonetic_fts
             WHERE :mode = 'fuzzy' AND persons_phonetic_fts MATCH :match
          )
          SELECT p.person_id, p.obs_key, p.full_name, p.role, p.source_dataset, p.sex, p.age,
                 p.event_year AS year, p.status, p.occupation,
                 COALESCE(p.plantation_name, c.plantation_name) AS plantation,
                 COALESCE(p.location, c.cert_place, c.address_text, p.district, c.district) AS place,
                 c.record_type, c.collection, p.certificate_id
          FROM hits h
          JOIN persons p ON p.person_id = h.person_id
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE (:dataset = '' OR p.source_dataset = :dataset)
            AND (:role = '' OR p.role = :role)
            AND (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
            AND (:place = '' OR (COALESCE(p.location, '') || ' ' || COALESCE(p.plantation_name, '') || ' ' ||
                 COALESCE(c.plantation_name, '') || ' ' || COALESCE(c.cert_place, '') || ' ' ||
                 COALESCE(c.address_text, '') || ' ' || COALESCE(p.district, '') || ' ' ||
                 COALESCE(c.district, '')) LIKE '%' || :place || '%')
            AND (:loc = '' OR p.certificate_id IN (SELECT certificate_id FROM locations WHERE location_norm = :loc))
          ORDER BY CASE WHEN :sort = 'year' THEN COALESCE(p.event_year, 9999) END, h.rank
          LIMIT 51 OFFSET CAST(:offset AS INTEGER)
      ui_facets:
        title: 'Search page: filter counts'
        hide_sql: true
        sql: |
          WITH hits AS (
            SELECT rowid AS person_id FROM persons_fts
             WHERE :mode <> 'fuzzy' AND persons_fts MATCH :match
            UNION ALL
            SELECT rowid AS person_id FROM persons_phonetic_fts
             WHERE :mode = 'fuzzy' AND persons_phonetic_fts MATCH :match
          ),
          f AS MATERIALIZED (
            SELECT p.person_id, p.certificate_id, p.source_dataset AS ds, p.role AS role,
                   (p.event_year / 10) * 10 AS decade
            FROM hits h
            JOIN persons p ON p.person_id = h.person_id
            LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
            WHERE (:dataset = '' OR p.source_dataset = :dataset)
              AND (:role = '' OR p.role = :role)
              AND (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
              AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
              AND (:place = '' OR (COALESCE(p.location, '') || ' ' || COALESCE(p.plantation_name, '') || ' ' ||
                   COALESCE(c.plantation_name, '') || ' ' || COALESCE(c.cert_place, '') || ' ' ||
                   COALESCE(c.address_text, '') || ' ' || COALESCE(p.district, '') || ' ' ||
                   COALESCE(c.district, '')) LIKE '%' || :place || '%')
              AND (:loc = '' OR p.certificate_id IN (SELECT certificate_id FROM locations WHERE location_norm = :loc))
          )
          SELECT 'dataset' AS facet, ds AS value, COUNT(*) AS n, NULL AS label FROM f GROUP BY ds
          UNION ALL SELECT 'role', role, COUNT(*), NULL FROM f GROUP BY role
          UNION ALL SELECT 'decade', decade, COUNT(*), NULL FROM f WHERE decade IS NOT NULL GROUP BY decade
          -- every place string on the matched records (plantation, record place, address,
          -- origin, ...), counted as persons; :loc_limit 15 for the top list, larger for "show all"
          UNION ALL SELECT * FROM (
            SELECT 'location', l.location_norm, COUNT(DISTINCT f.person_id) AS n, MIN(l.raw_text)
              FROM f JOIN locations l ON l.certificate_id = f.certificate_id
             WHERE l.location_norm IS NOT NULL
             GROUP BY l.location_norm ORDER BY n DESC
             LIMIT CAST(:loc_limit AS INTEGER))
      ui_pair_search:
        title: 'Search page: two persons on the same record'
        hide_sql: true
        sql: |
          -- :match and :match2 are FTS5 expressions for the first and the second person
          WITH h1 AS MATERIALIZED (
            SELECT rowid AS person_id FROM persons_fts WHERE :mode <> 'fuzzy' AND persons_fts MATCH :match
            UNION ALL
            SELECT rowid FROM persons_phonetic_fts WHERE :mode = 'fuzzy' AND persons_phonetic_fts MATCH :match
          ),
          h2 AS MATERIALIZED (
            SELECT rowid AS person_id FROM persons_fts WHERE :mode <> 'fuzzy' AND persons_fts MATCH :match2
            UNION ALL
            SELECT rowid FROM persons_phonetic_fts WHERE :mode = 'fuzzy' AND persons_phonetic_fts MATCH :match2
          ),
          pairs AS MATERIALIZED (
            SELECT p1.person_id AS id1, p2.person_id AS id2
            FROM h1
            JOIN persons p1 ON p1.person_id = h1.person_id
            JOIN persons p2 ON p2.certificate_id = p1.certificate_id AND p2.person_id <> p1.person_id
            LEFT JOIN certificates c1 ON c1.certificate_id = p1.certificate_id
            WHERE p2.person_id IN (SELECT person_id FROM h2)
            AND (:place = '' OR (COALESCE(p1.location, '') || ' ' || COALESCE(p1.plantation_name, '') || ' ' ||
                 COALESCE(c1.plantation_name, '') || ' ' || COALESCE(c1.cert_place, '') || ' ' ||
                 COALESCE(c1.address_text, '') || ' ' || COALESCE(p1.district, '') || ' ' ||
                 COALESCE(c1.district, '')) LIKE '%' || :place || '%')
            AND (:loc = '' OR p1.certificate_id IN (SELECT certificate_id FROM locations WHERE location_norm = :loc))
            AND (:dataset = '' OR p1.source_dataset = :dataset)
            AND (:role = '' OR p1.role = :role)
            AND (:role2 = '' OR p2.role = :role2)
            AND (:year_from = '' OR p1.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p1.event_year <= CAST(:year_to AS INTEGER))
          )
          SELECT p.person_id, p.obs_key, p.full_name, p.role, p.source_dataset, p.event_year AS year,
                 COALESCE(p.plantation_name, c.plantation_name) AS plantation,
                 COALESCE(p.location, c.cert_place, c.address_text, p.district, c.district) AS place,
                 p.occupation, c.record_type, c.collection, p.certificate_id,
                 o.person_id AS other_id, o.obs_key AS other_key, o.full_name AS other_name, o.role AS other_role
          FROM pairs
          JOIN persons p ON p.person_id = pairs.id1
          JOIN persons o ON o.person_id = pairs.id2
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          ORDER BY COALESCE(p.event_year, 9999), p.certificate_id
          LIMIT 51 OFFSET CAST(:offset AS INTEGER)
      ui_pair_facets:
        title: 'Search page: filter counts for two persons on the same record'
        hide_sql: true
        sql: |
          WITH h1 AS MATERIALIZED (
            SELECT rowid AS person_id FROM persons_fts WHERE :mode <> 'fuzzy' AND persons_fts MATCH :match
            UNION ALL
            SELECT rowid FROM persons_phonetic_fts WHERE :mode = 'fuzzy' AND persons_phonetic_fts MATCH :match
          ),
          h2 AS MATERIALIZED (
            SELECT rowid AS person_id FROM persons_fts WHERE :mode <> 'fuzzy' AND persons_fts MATCH :match2
            UNION ALL
            SELECT rowid FROM persons_phonetic_fts WHERE :mode = 'fuzzy' AND persons_phonetic_fts MATCH :match2
          ),
          pairs AS MATERIALIZED (
            SELECT p1.person_id AS id1, p2.person_id AS id2
            FROM h1
            JOIN persons p1 ON p1.person_id = h1.person_id
            JOIN persons p2 ON p2.certificate_id = p1.certificate_id AND p2.person_id <> p1.person_id
            LEFT JOIN certificates c1 ON c1.certificate_id = p1.certificate_id
            WHERE p2.person_id IN (SELECT person_id FROM h2)
            AND (:place = '' OR (COALESCE(p1.location, '') || ' ' || COALESCE(p1.plantation_name, '') || ' ' ||
                 COALESCE(c1.plantation_name, '') || ' ' || COALESCE(c1.cert_place, '') || ' ' ||
                 COALESCE(c1.address_text, '') || ' ' || COALESCE(p1.district, '') || ' ' ||
                 COALESCE(c1.district, '')) LIKE '%' || :place || '%')
            AND (:loc = '' OR p1.certificate_id IN (SELECT certificate_id FROM locations WHERE location_norm = :loc))
            AND (:dataset = '' OR p1.source_dataset = :dataset)
            AND (:role = '' OR p1.role = :role)
            AND (:role2 = '' OR p2.role = :role2)
            AND (:year_from = '' OR p1.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p1.event_year <= CAST(:year_to AS INTEGER))
          )
          SELECT 'dataset' AS facet, p.source_dataset AS value, COUNT(*) AS n, NULL AS label
            FROM pairs JOIN persons p ON p.person_id = pairs.id1 GROUP BY p.source_dataset
          UNION ALL SELECT 'role', p.role, COUNT(*), NULL
            FROM pairs JOIN persons p ON p.person_id = pairs.id1 GROUP BY p.role
          UNION ALL SELECT 'role2', p.role, COUNT(*), NULL
            FROM pairs JOIN persons p ON p.person_id = pairs.id2 GROUP BY p.role
          UNION ALL SELECT 'decade', (p.event_year / 10) * 10, COUNT(*), NULL
            FROM pairs JOIN persons p ON p.person_id = pairs.id1
           WHERE p.event_year IS NOT NULL GROUP BY (p.event_year / 10) * 10
      ui_person:
        title: 'Search page: one person with their record'
        hide_sql: true
        sql: |
          SELECT p.*, s.title AS dataset_title, s.license, s.embargo,
                 c.record_type, c.collection, c.register, c.item_id, c.inventory_number,
                 c.folio, c.page, c.certificate_number, c.series,
                 c.event_date AS record_event_date, c.cert_date AS record_date,
                 c.cert_place AS record_place, c.cert_location AS record_location,
                 c.district AS record_district, c.plantation_name AS record_plantation,
                 c.ward_code AS record_ward, c.address_text AS record_address,
                 c.contract_number AS record_contract, c.registration_number AS record_registration
          FROM persons p
          LEFT JOIN certificates c ON c.certificate_id = p.certificate_id
          LEFT JOIN sources s ON s.source_dataset = p.source_dataset
          -- by stable observation key (:key) or, for old links, by row id (:id)
          WHERE p.person_id = (SELECT person_id FROM persons WHERE obs_key = :key
                               UNION ALL SELECT CAST(:id AS INTEGER) WHERE :key = ''
                               LIMIT 1)
      ui_record_persons:
        title: 'Search page: everyone on the same record'
        hide_sql: true
        sql: |
          SELECT person_id, obs_key, full_name, role, role_index, sex, age, occupation, status
          FROM persons
          WHERE certificate_id = CAST(:cert AS INTEGER)
          ORDER BY role, role_index, person_id
          LIMIT 200
      ui_relations:
        title: 'Search page: relations of a person'
        hide_sql: true
        sql: |
          SELECT r.relation_type, r.confidence, r.detail, r.certificate_id,
                 CASE WHEN r.from_person = CAST(:id AS INTEGER) THEN 'out' ELSE 'in' END AS direction,
                 o.person_id AS other_id, o.obs_key AS other_key, o.full_name AS other_name, o.role AS other_role,
                 o.source_dataset AS other_dataset, o.event_year AS other_year
          FROM relations r
          JOIN persons o ON o.person_id = CASE WHEN r.from_person = CAST(:id AS INTEGER)
                                               THEN r.to_person ELSE r.from_person END
          WHERE r.from_person = CAST(:id AS INTEGER) OR r.to_person = CAST(:id AS INTEGER)
          LIMIT 300
      ui_names:
        title: 'Search page: other names of a person'
        hide_sql: true
        sql: |
          SELECT kind, value FROM person_names WHERE person_id = CAST(:id AS INTEGER)
      ui_notes:
        title: 'Search page: notes and memo fields of a record'
        hide_sql: true
        sql: |
          -- notes of this record; notes without a record (shared scan ids) via dataset + item id
          SELECT a.status, a.text, a.user_id, a.timestamp
          FROM certificates c
          JOIN annotations a
            ON a.certificate_id = c.certificate_id
            OR (a.certificate_id IS NULL AND a.source_dataset = c.source_dataset AND a.item_id = c.item_id)
          WHERE c.certificate_id = CAST(:cert AS INTEGER)
          ORDER BY a.annotation_id
          LIMIT 100
      ui_record_places:
        title: 'Search page: places named on a record'
        hide_sql: true
        sql: |
          SELECT raw_text, location_norm, field_origin, precision
          FROM locations
          WHERE certificate_id = CAST(:cert AS INTEGER)
          ORDER BY location_id
      ui_same_name:
        title: 'Search page: same name elsewhere (candidates, never merged)'
        hide_sql: true
        sql: |
          -- only name kinds that name the person themself (not father_name, spouse_name
          -- or places of origin, which person_names also holds)
          WITH me AS (SELECT person_id, name_norm FROM persons WHERE person_id = CAST(:id AS INTEGER)),
          own_names AS (
            SELECT person_id, kind, value_norm FROM person_names
             WHERE kind IN ('orig_spelling', 'former_name', 'emancipation_name', 'maiden_name',
                            'widow_name', 'baptized_name', 'display_name')
          ),
          keys AS (
            SELECT name_norm AS k FROM me WHERE name_norm IS NOT NULL
            UNION SELECT value_norm FROM own_names
             WHERE person_id = (SELECT person_id FROM me) AND value_norm IS NOT NULL
          ),
          cand AS (
            SELECT p.person_id, 'name' AS via FROM persons p WHERE p.name_norm IN (SELECT k FROM keys)
            UNION
            SELECT n.person_id, n.kind FROM own_names n WHERE n.value_norm IN (SELECT k FROM keys)
          )
          SELECT p.person_id, p.obs_key, p.full_name, p.role, p.source_dataset, p.event_year AS year,
                 COALESCE(p.plantation_name, p.location, p.district) AS place, MIN(cand.via) AS via
          FROM cand JOIN persons p ON p.person_id = cand.person_id
          WHERE p.person_id <> CAST(:id AS INTEGER)
          GROUP BY p.person_id
          ORDER BY p.event_year
          LIMIT 150
      ui_places:
        title: 'Search page: place names'
        hide_sql: true
        sql: |
          -- words are lower-cased without accents by the page (up to six); every word must occur
          SELECT place_norm, label, records, datasets FROM places
          WHERE place_norm LIKE '%' || :w1 || '%'
            AND (:w2 = '' OR place_norm LIKE '%' || :w2 || '%')
            AND (:w3 = '' OR place_norm LIKE '%' || :w3 || '%')
            AND (:w4 = '' OR place_norm LIKE '%' || :w4 || '%')
            AND (:w5 = '' OR place_norm LIKE '%' || :w5 || '%')
            AND (:w6 = '' OR place_norm LIKE '%' || :w6 || '%')
          ORDER BY records DESC
          LIMIT 200
      ui_place_search:
        title: 'Search page: persons on records at one place'
        hide_sql: true
        sql: |
          WITH recs AS (SELECT DISTINCT certificate_id FROM locations WHERE location_norm = :place_norm)
          SELECT p.person_id, p.obs_key, p.full_name, p.role, p.source_dataset, p.sex, p.age,
                 p.event_year AS year, p.status, p.occupation,
                 COALESCE(p.plantation_name, c.plantation_name) AS plantation,
                 COALESCE(p.location, c.cert_place, c.address_text, p.district, c.district) AS place,
                 c.record_type, c.collection, p.certificate_id
          FROM recs
          JOIN persons p ON p.certificate_id = recs.certificate_id
          JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE 1 = 1
            AND (:dataset = '' OR p.source_dataset = :dataset)
            AND (:role = '' OR p.role = :role)
            AND (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
            AND (:loc = '' OR p.certificate_id IN (SELECT certificate_id FROM locations WHERE location_norm = :loc))
          ORDER BY COALESCE(p.event_year, 9999), p.certificate_id, p.person_id
          LIMIT 51 OFFSET CAST(:offset AS INTEGER)
      ui_place_facets:
        title: 'Search page: filter counts for one place'
        hide_sql: true
        sql: |
          WITH recs AS (SELECT DISTINCT certificate_id FROM locations WHERE location_norm = :place_norm),
          f AS MATERIALIZED (
            SELECT p.person_id, p.certificate_id, p.source_dataset AS ds, p.role AS role,
                   (p.event_year / 10) * 10 AS decade
            FROM recs JOIN persons p ON p.certificate_id = recs.certificate_id
            WHERE 1 = 1
            AND (:dataset = '' OR p.source_dataset = :dataset)
            AND (:role = '' OR p.role = :role)
            AND (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
            AND (:loc = '' OR p.certificate_id IN (SELECT certificate_id FROM locations WHERE location_norm = :loc))
          )
          SELECT 'dataset' AS facet, ds AS value, COUNT(*) AS n, NULL AS label FROM f GROUP BY ds
          UNION ALL SELECT 'role', role, COUNT(*), NULL FROM f GROUP BY role
          UNION ALL SELECT 'decade', decade, COUNT(*), NULL FROM f WHERE decade IS NOT NULL GROUP BY decade
          UNION ALL SELECT * FROM (
            SELECT 'location', l.location_norm, COUNT(DISTINCT f.person_id) AS n, MIN(l.raw_text)
              FROM f JOIN locations l ON l.certificate_id = f.certificate_id
             WHERE l.location_norm IS NOT NULL AND l.location_norm <> :place_norm
             GROUP BY l.location_norm ORDER BY n DESC
             LIMIT CAST(:loc_limit AS INTEGER))
      ui_datasets:
        title: 'Search page: dataset list'
        hide_sql: true
        sql: |
          SELECT source_dataset, title, license, embargo, notes FROM sources ORDER BY source_dataset
      person_places:
        title: 'Map: places on the records of a person and of their same-name candidates'
        description: >-
          For a person's trail on the map. relation = 'own' (records of this person_id) or
          'candidate' (same name elsewhere, as in ui_same_name; never merged). Every place named
          on those records, with coordinates where place_geo has them.
        hide_sql: true
        sql: |
          WITH me AS (SELECT person_id, name_norm FROM persons WHERE person_id = CAST(:id AS INTEGER)),
          own_names AS (
            SELECT person_id, kind, value_norm FROM person_names
             WHERE kind IN ('orig_spelling', 'former_name', 'emancipation_name', 'maiden_name',
                            'widow_name', 'baptized_name', 'display_name')
          ),
          keys AS (
            SELECT name_norm AS k FROM me WHERE name_norm IS NOT NULL
            UNION SELECT value_norm FROM own_names
             WHERE person_id = (SELECT person_id FROM me) AND value_norm IS NOT NULL
          ),
          cand AS (
            SELECT p.person_id FROM persons p WHERE p.name_norm IN (SELECT k FROM keys)
            UNION
            SELECT n.person_id FROM own_names n WHERE n.value_norm IN (SELECT k FROM keys)
          ),
          people AS (
            SELECT person_id, 'own' AS relation FROM me
            UNION ALL
            SELECT * FROM (SELECT person_id, 'candidate' FROM cand
                            WHERE person_id <> CAST(:id AS INTEGER) LIMIT 150)
          )
          SELECT pe.relation, p.person_id, p.obs_key, p.full_name, p.role,
                 l.certificate_id, c.source_dataset, c.event_year, l.field_origin,
                 l.raw_text, l.location_norm, g.gazetteer_id, g.label AS place_label,
                 g.lat, g.lng, g.match_type, g.confidence
          FROM people pe
          JOIN persons p ON p.person_id = pe.person_id
          JOIN certificates c ON c.certificate_id = p.certificate_id
          JOIN locations l ON l.certificate_id = p.certificate_id
          LEFT JOIN place_geo g ON g.location_norm = l.location_norm
          ORDER BY pe.relation DESC, c.event_year, l.certificate_id, l.location_id
          LIMIT 1000
      record_places_geo:
        title: 'Map: places named on one record, with coordinates'
        hide_sql: true
        sql: |
          SELECT l.raw_text, l.location_norm, l.field_origin, l.precision,
                 g.gazetteer_id, g.gazetteer_uri, g.label AS place_label,
                 g.lat, g.lng, g.match_type, g.confidence, g.note
          FROM locations l
          LEFT JOIN place_geo g ON g.location_norm = l.location_norm
          WHERE l.certificate_id = CAST(:cert AS INTEGER)
          ORDER BY l.location_id
      map_places:
        title: 'Map: overview, place strings with coordinates by number of records'
        description: >-
          One row per place string (several spellings can share one point; group on gazetteer_id
          to draw one marker per point, or use map_points).
        hide_sql: true
        sql: |
          SELECT g.location_norm, p.label, p.records, p.datasets, g.gazetteer_id, g.gazetteer_uri,
                 g.lat, g.lng, g.match_type, g.confidence
          FROM place_geo g
          JOIN places p ON p.place_norm = g.location_norm
          WHERE g.lat IS NOT NULL
          ORDER BY p.records DESC
          LIMIT 2000
      map_points:
        title: 'Map: overview, one row per point (all spellings together)'
        hide_sql: true
        sql: |
          SELECT g.gazetteer_id, z.prefLabel AS place_label, z.type, g.lat, g.lng,
                 SUM(p.records) AS records, COUNT(*) AS spellings,
                 MAX(g.confidence) AS best_confidence, MIN(g.match_type) AS match_type
          FROM place_geo g
          JOIN places p ON p.place_norm = g.location_norm
          LEFT JOIN gazetteer z ON z.id = g.gazetteer_id
          WHERE g.lat IS NOT NULL
          GROUP BY g.gazetteer_id
          ORDER BY records DESC
          LIMIT 2000
      place_wall:
        title: 'Map: names at one place (wall of names)'
        hide_sql: true
        sql: |
          WITH recs AS (SELECT DISTINCT certificate_id FROM locations WHERE location_norm = :place_norm)
          SELECT p.person_id, p.obs_key, p.full_name, p.role, p.source_dataset, p.sex, p.age,
                 p.event_year AS year, p.status, p.occupation,
                 COALESCE(p.plantation_name, c.plantation_name) AS plantation,
                 COALESCE(p.location, c.cert_place, c.address_text, p.district, c.district) AS place,
                 c.record_type, c.collection, p.certificate_id
          FROM recs
          JOIN persons p ON p.certificate_id = recs.certificate_id
          JOIN certificates c ON c.certificate_id = p.certificate_id
          WHERE 1 = 1
            AND (:dataset = '' OR p.source_dataset = :dataset)
            AND (:role = '' OR p.role = :role)
            AND (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
          ORDER BY COALESCE(p.event_year, 9999), p.certificate_id, p.person_id
          LIMIT 1000
      place_wall_point:
        title: 'Map: names at one point (all spellings of a gazetteer place)'
        hide_sql: true
        sql: |
          WITH recs AS (SELECT DISTINCT certificate_id FROM locations WHERE place_id = :gazetteer_id)
          SELECT p.person_id, p.obs_key, p.full_name, p.role, p.source_dataset, p.sex, p.age,
                 p.event_year AS year, p.status, p.occupation, p.certificate_id
          FROM recs
          JOIN persons p ON p.certificate_id = recs.certificate_id
          WHERE (:year_from = '' OR p.event_year >= CAST(:year_from AS INTEGER))
            AND (:year_to = '' OR p.event_year <= CAST(:year_to AS INTEGER))
          ORDER BY COALESCE(p.event_year, 9999), p.certificate_id, p.person_id
          LIMIT 1000
      patient_start:
        title: 'Militair Hospitaal 1921: one patient with census entries and links into the full data'
        description: >-
          soort = 'patient' (the patient), 'vermelding' (a census 1921 row of this patient) or
          'koppeling' (a link to a record in another dataset, with resultaat / rol / methode /
          toelichting). person_id and certificate_id lead into ui_person, ui_relations,
          record_places_geo and person_places.
        hide_sql: true
        sql: |
          SELECT 'patient' AS soort, pt.patient_id AS id, NULL AS person_id, NULL AS certificate_id,
                 NULL AS obs_key, pt.achternaam || ' ' || COALESCE(pt.initialen_of_contractnr, '') AS naam,
                 '09-volkstelling-1921' AS dataset, pt.geboortejaar AS jaar,
                 pt.beste_resultaat AS resultaat, pt.groep AS rol, pt.gevonden_in AS methode,
                 pt.aantal_vermeldingen AS toelichting
          FROM mh1921_patienten pt WHERE pt.patient_id = CAST(:patient_id AS INTEGER)
          UNION ALL
          SELECT 'vermelding', v.vermelding_id, v.person_id, v.certificate_id, p.obs_key,
                 COALESCE(p.full_name, v.achternaam || ' ' || COALESCE(v.initialen_of_contractnr, '')),
                 '09-volkstelling-1921', COALESCE(p.event_year, 1921), NULL, p.role, NULL, v.geboortejaar
          FROM mh1921_vermeldingen v LEFT JOIN persons p ON p.person_id = v.person_id
          WHERE v.patient_id = CAST(:patient_id AS INTEGER)
          UNION ALL
          SELECT 'koppeling', k.koppeling_id, k.doel_person_id, k.doel_certificate_id, p.obs_key,
                 p.full_name, k.doel_dataset, p.event_year, k.resultaat, k.rol_in_doelrecord,
                 k.methode, k.toelichting
          FROM mh1921_koppelingen k LEFT JOIN persons p ON p.person_id = k.doel_person_id
          WHERE k.patient_id = CAST(:patient_id AS INTEGER)
  contributions:
    description: >-
      Knowledge added by visitors about deceased people (relations, same-person suggestions,
      stories, corrections), and spoken stories from the "I was here" app with the entities
      recognised in them. Separate, writable file; the archive stays read-only.
      Contributions can contain personal data: reviewed = 0 until a team member has checked them.
      Reads are cached for an hour server-wide: add ?_ttl=0 to see new rows at once.
    tables:
      contributions:
        facets: [kind, reviewed, consent, relation_type, field]
      stories:
        facets: [reviewed, consent, narrator_relation]
      story_entities:
        facets: [type, category, confirmed]
    queries:
      # ---- Writes (POST, no login: writes are open for the hackathon demo) -------------
      # Parameters that are not sent, or sent as '', are stored as NULL.
      add_contribution:
        title: 'Add a contribution (POST)'
        write: true
        on_success_message: Contribution saved
        sql: |
          INSERT INTO contributions (person_id, obs_key, patient_id, kind, value, related_person_id,
                                     contributor, consent, reviewed, created_at,
                                     uid, story_id, person_key, relation_type, related_key,
                                     related_obs_key, related_patient_id, name_raw, field, place_raw,
                                     place_norm, year, quote, confirmed, contributor_key)
          VALUES (NULLIF(:person_id, ''), NULLIF(:obs_key, ''), NULLIF(:patient_id, ''), :kind, :value,
                  NULLIF(:related_person_id, ''), NULLIF(:contributor, ''),
                  CASE WHEN lower(CAST(:consent AS TEXT)) IN ('1', 'true', 'yes', 'ja') THEN 1 ELSE 0 END,
                  0, datetime('now'),
                  NULLIF(:uid, ''), NULLIF(:story_id, ''), NULLIF(:person_key, ''),
                  NULLIF(:relation_type, ''), NULLIF(:related_key, ''), NULLIF(:related_obs_key, ''),
                  NULLIF(:related_patient_id, ''), NULLIF(:name_raw, ''), NULLIF(:field, ''),
                  NULLIF(:place_raw, ''), NULLIF(:place_norm, ''), NULLIF(:year, ''), NULLIF(:quote, ''),
                  CASE WHEN lower(CAST(:confirmed AS TEXT)) IN ('1', 'true', 'yes', 'ja') THEN 1 ELSE 0 END,
                  NULLIF(:contributor_key, ''))
      add_story:
        title: 'Add a story (POST)'
        write: true
        on_success_message: Story saved
        sql: |
          INSERT INTO stories (id, person_key, person_id, obs_key, patient_id, person_name, transcript,
                               summary, narrator_key, narrator_name, narrator_relation,
                               narrator_relation_label, narrator_about, consent, created_at, reviewed)
          VALUES (:id, NULLIF(:person_key, ''), NULLIF(:person_id, ''), NULLIF(:obs_key, ''),
                  NULLIF(:patient_id, ''), NULLIF(:person_name, ''), NULLIF(:transcript, ''),
                  NULLIF(:summary, ''), NULLIF(:narrator_key, ''), NULLIF(:narrator_name, ''),
                  NULLIF(:narrator_relation, ''), NULLIF(:narrator_relation_label, ''),
                  NULLIF(:narrator_about, ''),
                  CASE WHEN lower(CAST(:consent AS TEXT)) IN ('1', 'true', 'yes', 'ja') THEN 1 ELSE 0 END,
                  COALESCE(NULLIF(:created_at, ''), datetime('now')), 0)
      add_story_entities:
        title: 'Add the entities of a story (POST, many rows at once)'
        description: >-
          rows = a JSON array (sent as one string) of objects with the story_entities columns:
          id, story_id, start, end, mention, type, category, about, is_subject, confirmed, quote,
          link, link_label, link_person_id, link_obs_key, link_patient_id, link_place_norm,
          contribution_uid. story_id may be left out of the objects and given once as story_id.
        write: true
        on_success_message: Entities saved
        sql: |
          INSERT INTO story_entities (id, story_id, start, "end", mention, type, category, about,
                                      is_subject, confirmed, quote, link, link_label, link_person_id,
                                      link_obs_key, link_patient_id, link_place_norm, contribution_uid)
          SELECT json_extract(value, '$.id'),
                 COALESCE(json_extract(value, '$.story_id'), NULLIF(:story_id, '')),
                 json_extract(value, '$.start'), json_extract(value, '$.end'),
                 json_extract(value, '$.mention'), json_extract(value, '$.type'),
                 json_extract(value, '$.category'), json_extract(value, '$.about'),
                 json_extract(value, '$.is_subject'), json_extract(value, '$.confirmed'),
                 json_extract(value, '$.quote'), json_extract(value, '$.link'),
                 json_extract(value, '$.link_label'), json_extract(value, '$.link_person_id'),
                 json_extract(value, '$.link_obs_key'), json_extract(value, '$.link_patient_id'),
                 json_extract(value, '$.link_place_norm'), json_extract(value, '$.contribution_uid')
          FROM json_each(:rows)
      add_story_contributions:
        title: 'Add the dataset rows of a story (POST, many rows at once)'
        description: >-
          rows = a JSON array (sent as one string) of objects with contributions columns (all
          optional): uid, story_id, person_key, person_id, obs_key, patient_id, kind, value,
          relation_type, related_key, related_person_id, related_obs_key, related_patient_id,
          name_raw, field, place_raw, place_norm, year, quote, confirmed, contributor,
          contributor_key, consent. story_id may be given once as story_id.
          id, reviewed (0) and created_at are set by the database.
        write: true
        on_success_message: Contributions saved
        sql: |
          INSERT INTO contributions (uid, story_id, person_key, person_id, obs_key, patient_id, kind, value,
                                     relation_type, related_key, related_person_id, related_obs_key,
                                     related_patient_id, name_raw, field, place_raw, place_norm, year,
                                     quote, confirmed, contributor, contributor_key, consent,
                                     reviewed, created_at)
          SELECT json_extract(value, '$.uid'),
                 COALESCE(json_extract(value, '$.story_id'), NULLIF(:story_id, '')),
                 json_extract(value, '$.person_key'), json_extract(value, '$.person_id'),
                 json_extract(value, '$.obs_key'), json_extract(value, '$.patient_id'),
                 json_extract(value, '$.kind'), json_extract(value, '$.value'),
                 json_extract(value, '$.relation_type'), json_extract(value, '$.related_key'),
                 json_extract(value, '$.related_person_id'), json_extract(value, '$.related_obs_key'),
                 json_extract(value, '$.related_patient_id'), json_extract(value, '$.name_raw'),
                 json_extract(value, '$.field'), json_extract(value, '$.place_raw'),
                 json_extract(value, '$.place_norm'), json_extract(value, '$.year'),
                 json_extract(value, '$.quote'), json_extract(value, '$.confirmed'),
                 json_extract(value, '$.contributor'), json_extract(value, '$.contributor_key'),
                 json_extract(value, '$.consent'), 0, datetime('now')
          FROM json_each(:rows)
      # ---- Reads -------------------------------------------------------------------------
      contributions_since:
        title: 'Contributions after a given id (for syncing; call with ?_ttl=0)'
        hide_sql: true
        sql: |
          SELECT * FROM contributions WHERE id > CAST(:since AS INTEGER) ORDER BY id LIMIT 1000
      contributions_for_person:
        title: 'Contributions about one person (reviewed only, unless include_unreviewed=1)'
        hide_sql: true
        sql: |
          SELECT id, person_id, obs_key, patient_id, kind, value, related_person_id, reviewed, created_at
          FROM contributions
          WHERE person_id = CAST(:person_id AS INTEGER)
            AND (reviewed = 1 OR CAST(:include_unreviewed AS TEXT) = '1')
          ORDER BY id
      stories_for_person:
        title: 'Stories about one person (key = patient:/person:/name:..., reviewed only unless include_unreviewed=1)'
        hide_sql: true
        sql: |
          SELECT s.*
          FROM stories s
          WHERE (s.person_key = :key
                 OR s.id IN (SELECT story_id FROM story_entities WHERE link = :key))
            AND (s.reviewed = 1 OR CAST(:include_unreviewed AS TEXT) = '1')
          ORDER BY s.created_at DESC
          LIMIT 200
      story:
        title: 'One story'
        hide_sql: true
        sql: |
          SELECT * FROM stories WHERE id = :id
      story_entities_for:
        title: 'Entities of one story, in transcript order'
        hide_sql: true
        sql: |
          SELECT * FROM story_entities WHERE story_id = :story_id ORDER BY start, "end"
      contributions_for_story:
        title: 'Dataset rows of one story'
        hide_sql: true
        sql: |
          SELECT * FROM contributions WHERE story_id = :story_id ORDER BY id
